<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 조회</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 16px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { width: 120px; background: #f5f5f5; }
        .content { min-height: 200px; white-space: pre-wrap; vertical-align: top; }
        .buttons { margin-top: 16px; }
        a.btn { padding: 6px 14px; color: #fff; text-decoration: none; border-radius: 4px; }
        .blue { background: #2f6fed; }
        .gray { background: #777; }
    </style>
</head>
<body>
    <h1>게시글 조회</h1>

    <!-- 게시글 데이터 출력 -->
    <table>
        <tr>
            <th>번호</th>
            <td th:text="${post.id}">1</td>
        </tr>
        <tr>
            <th>제목</th>
            <td th:text="${post.title}">제목</td>
        </tr>
        <tr>
            <th>작성자</th>
            <td th:text="${post.writer}">작성자</td>
        </tr>
        <tr>
            <th>조회수</th>
            <td th:text="${post.viewCount}">0</td>
        </tr>
        <tr>
            <th>작성일</th>
            <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2026-01-01 00:00</td>
        </tr>
        <tr>
            <th>수정일</th>
            <td th:text="${#temporals.format(post.updatedAt, 'yyyy-MM-dd HH:mm')}">2026-01-01 00:00</td>
        </tr>
        <tr>
            <th>내용</th>
            <td class="content" th:text="${post.content}">내용</td>
        </tr>
    </table>

    <!-- [수정], [목록] 버튼 -->
    <div class="buttons">
        <a class="btn blue" th:href="@{/Post/update/{id}(id=${post.id})}">수정</a>
        <a class="btn gray" th:href="@{/Post/list}">목록</a>
    </div>
</body>
</html>
