<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 등록</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 16px; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input[type=text], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        textarea { height: 200px; }
        .buttons { margin-top: 16px; }
        button, a.btn { padding: 6px 14px; border: none; color: #fff; text-decoration: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .blue { background: #2f6fed; }
        .gray { background: #777; }
    </style>
</head>
<body>
    <h1>게시글 등록</h1>

    <!-- 등록 폼 : POST /Post/insert -->
    <form th:action="@{/Post/insert}" method="post">
        <label for="title">제목</label>
        <input type="text" id="title" name="title" required>

        <label for="writer">작성자</label>
        <input type="text" id="writer" name="writer" required>

        <label for="content">내용</label>
        <textarea id="content" name="content" required></textarea>

        <div class="buttons">
            <button type="submit" class="blue">등록</button>
            <a class="btn gray" th:href="@{/Post/list}">목록</a>
        </div>
    </form>
</body>
</html>
