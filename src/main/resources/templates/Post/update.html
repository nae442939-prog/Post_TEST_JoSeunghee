<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 수정</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 16px; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input[type=text], textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        input[readonly] { background: #f0f0f0; }
        textarea { height: 200px; }
        .buttons { margin-top: 16px; display: flex; gap: 8px; }
        button, a.btn { padding: 6px 14px; border: none; color: #fff; text-decoration: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .blue { background: #2f6fed; }
        .red { background: #d9534f; }
        .gray { background: #777; }
    </style>
</head>
<body>
    <h1>게시글 수정</h1>

    <!-- 수정 폼 : 기존 게시글 데이터 출력 + 수정 -->
    <form id="updateForm" th:action="@{/Post/update}" method="post">
        <input type="hidden" name="id" th:value="${post.id}">

        <label>번호</label>
        <input type="text" th:value="${post.id}" readonly>

        <label for="title">제목</label>
        <input type="text" id="title" name="title" th:value="${post.title}" required>

        <label>작성자</label>
        <input type="text" th:value="${post.writer}" readonly>

        <label for="content">내용</label>
        <textarea id="content" name="content" th:text="${post.content}" required></textarea>
    </form>

    <!-- 삭제 폼 : POST /Post/delete -->
    <form id="deleteForm" th:action="@{/Post/delete}" method="post">
        <input type="hidden" name="id" th:value="${post.id}">
    </form>

    <!-- [수정], [삭제], [목록] 버튼 -->
    <div class="buttons">
        <button type="submit" form="updateForm" class="blue">수정</button>
        <button type="submit" form="deleteForm" class="red"
                onclick="return confirm('정말 삭제하시겠습니까?');">삭제</button>
        <a class="btn gray" th:href="@{/Post/list}">목록</a>
    </div>
</body>
</html>
